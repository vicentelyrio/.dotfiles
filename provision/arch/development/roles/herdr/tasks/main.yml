---
- name: Herdr - install
  kewlfft.aur.aur:
    use: yay
    name: herdr-bin
    state: present
  become: true
  become_user: aur_builder

- name: Herdr - create config directory
  ansible.builtin.file:
    path: "~/.config/herdr"
    state: directory
    mode: "0755"

- name: Herdr - symlink files
  ansible.builtin.file:
    src: "{{ playbook_dir }}/roles/herdr/files/herdr/{{ item }}"
    dest: "~/.config/herdr/{{ item }}"
    state: link
    follow: false
    force: true
  with_items:
    - config.toml
