---
- name: Herdr - check if already installed
  ansible.builtin.command: command -v herdr
  register: herdr_installed
  changed_when: false
  failed_when: false

- name: Herdr - install
  ansible.builtin.shell: curl -fsSL https://herdr.dev/install.sh | sh
  args:
    executable: /bin/bash
  when: herdr_installed.rc != 0

- name: Herdr - create config directory
  ansible.builtin.file:
    path: "~/.config/herdr"
    state: directory
    mode: "0755"

- name: Herdr - symlink files
  ansible.builtin.file:
    src: "{{ playbook_dir }}/roles/herdr/files/herdr/{{ item }}"
    dest: "~/.config/herdr/{{ item }}"
    state: link
    follow: false
    force: true
  with_items:
    - config.toml
