---
- name: Terminals - install
  become: true
  become_user: root
  ansible.builtin.package:
    name:
      - alacritty
      - wezterm
      - kitty
      - ghostty
    state: present

- name: Alacritty
  ansible.builtin.import_tasks: ./config/alacritty.yml

- name: Wezterm
  ansible.builtin.import_tasks: ./config/wezterm.yml

- name: Kitty
  ansible.builtin.import_tasks: ./config/kitty.yml

- name: Ghostty
  ansible.builtin.import_tasks: ./config/ghostty.yml
