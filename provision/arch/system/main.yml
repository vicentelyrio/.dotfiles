---
- name: Arch System Roles
  hosts: local
  vars_files: ../../vars/all.yml
  ignore_errors: true
  roles:
    # System
    - system-aur-builder
    - system-rkhunter
    - system-yay
    - system-pacman
    - system-user
    - system-xdg
    - system-pacseek
    - system-grub
    - system-gpu
    - system-greetd
    - system-cronie
    - system-backup
    - system-cpu
    - system-locale
    - system-time
    - system-ssh
    - system-keyboard
    - system-network
    - system-bluetooth
    - system-audio
    - system-brightness
    - system-player
    - system-tailscale

    # Interface
    - ui-theme
    - ui-niri
    - ui-font-manager
    - ui-file-manager
