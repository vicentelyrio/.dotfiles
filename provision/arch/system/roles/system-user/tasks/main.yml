---
- name: Ensure group user.group exists
  ansible.builtin.group:
    name: "{{ user.group }}"
    state: present
  when: user.name is defined

- name: Ensure the user user.name exists
  become: true
  become_user: root
  ansible.builtin.user:
    name: "{{ user.name }}"
    shell: "{{ user.shell }}"
    groups:
      - "{{ user.group }}"
      - wheel
      - network
      - lock
      - uucp
      - video
    append: true
    system: false
    createhome: true
    home: /home/{{ user.name }}
  when: user.name is defined

# archinstall doesn't reliably leave this account with a usable password, and
# nothing else in this playbook sets one — without this, a fresh install ends
# up locked out at both the greeter and tty logins after reboot.
- name: Set user.name password
  become: true
  become_user: root
  ansible.builtin.user:
    name: "{{ user.name }}"
    password: "{{ user_password | password_hash('sha512') }}"
  when:
    - user.name is defined
    - user_password is defined
    - user_password | length > 0
