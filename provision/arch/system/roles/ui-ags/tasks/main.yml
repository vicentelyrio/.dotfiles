---
- name: Ags - install
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    use: yay
    name:
      - aylurs-gtk-shell
      - libdbusmenu-gtk3
    state: present
  notify: Rkhunter propupdate
  register: ags_install
  failed_when: false

- name: AGS - check if config repo already exists
  ansible.builtin.stat:
    path: "~/.config/ags/.git"
  register: ags_repo

- name: AGS - clone config from repo (only if not already cloned)
  ansible.builtin.git:
    repo: "git@github.com:vicentelyrio/ags-desktop.git"
    dest: "~/.config/ags"
    clone: true
    version: main
    update: false
  when: not ags_repo.stat.exists
  register: ags_clone
  failed_when:
    - ags_clone.failed | default(false)
    - "'Local modifications' not in (ags_clone.msg | default(''))"

- name: AGS - repo present, skipping update to preserve local changes
  ansible.builtin.debug:
    msg: >-
      ~/.config/ags already cloned. Not pulling automatically to avoid
      clobbering local edits. Pull manually when ready.
  when: ags_repo.stat.exists
