[keys]
prefix = "ctrl+b"

navigate_workspace_up = "k"
navigate_workspace_down = "j"

focus_pane_left  = ["prefix+h", "cmd+shift+h"]
focus_pane_down  = ["prefix+j", "cmd+shift+j"]
focus_pane_up    = ["prefix+k", "cmd+shift+k"]
focus_pane_right = ["prefix+l", "cmd+shift+l"]

split_vertical   = "prefix+|"
split_horizontal = "prefix+minus"
close_pane       = "prefix+x"
zoom             = ["prefix+z", "cmd+shift+s"]

new_tab      = "prefix+c"
next_tab     = ["prefix+n", "ctrl+shift+l"]
previous_tab = ["prefix+p", "ctrl+shift+h"]
switch_tab   = "prefix+1..9"
rename_tab   = "prefix+shift+t"
close_tab    = "prefix+shift+x"

detach         = "prefix+d"
reload_config  = "prefix+shift+r"
toggle_sidebar = "prefix+b"
